# Chargement minimal des schémas et du backend
include /etc/ldap/schema/core.schema

pidfile /var/run/slapd/slapd.pid
argsfile /var/run/slapd/slapd.args

modulepath /usr/lib/ldap
moduleload back_mdb

loglevel stats

# Base DN et accès administrateur
suffix "dc=efrei,dc=fr"
rootdn "cn=admin,dc=efrei,dc=fr"
rootpw adminpassword

database mdb
maxsize 1073741824
directory /var/lib/ldap

# Configuration TLS/LDAPS
TLSCertificateFile      /chemin/absolu/vers/SecureChatProject/server/certs/ldap_server_cert.pem
TLSCertificateKeyFile   /chemin/absolu/vers/SecureChatProject/server/certs/ldap_server_key.pem
TLSCACertificateFile    /chemin/absolu/vers/SecureChatProject/server/certs/ca_cert.pem
TLSVerifyClient         never
TLSCipherSuite          HIGH:MEDIUM:+TLSv1.2
TLSProtocolMin          3.3

# Si votre serveur est accessible en 127.0.0.1:636, cela suffit.
# Adaptez les chemins, le suffixe et le password admin avant de démarrer slapd.
